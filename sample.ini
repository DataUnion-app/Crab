[application]
port = 8080
version = 1.0
env = development
secret_key = secret
jwt_secret_string = jwt_secret
legacy_jwt_refresh_secret_string =
legacy_jwt_refresh_deadline_epoch = 0
upload_folder = data
# Set to "yes" to prevent the same device being registered to multiple wallet/Eth IDs.
# Set to "no" to allow device re-registration to a different wallet (disables anti-multi-wallet protection).
enforce_unique_device_registration = yes
# value in seconds
jwt_access_token_validity = 1500000
jwt_refresh_token_validity = 1500000
qr_code_text = Image uploaded to dataUnion.app
debug = true
minimum_file_upload_interval = 15552000
max_content_length_mb = 20
# Comma-separated exact browser origins. Wildcards are intentionally ignored.
cors_allowed_origins = https://app.example

app_name = brainstem

# Set this 'yes' for production env and can be 'no' to access apis without signature verification.
jwt_on = yes

# Used for generating avatar for wedatanation
pollinations_jwt_token = <jwt_token_here>

# Seconds - Used by celery beat
ncight_notification_task_interval = 20

[logging]
file_name = app.log

# WARNING = 30, INFO = 20, DEBUG = 10
level = 10

[couchdb]
user = user
password = password
db_host = 127.0.0.1:5984
connect_timeout_seconds = 3.05
read_timeout_seconds = 30
metadata_db = metadata
users_db = users
cohort_releases_db = cohort_releases
studies_db = brainstem_studies
study_activation_db = brainstem_study_activation
study_operations_db = brainstem_study_operations
sessions_db = sessions
static_data_db = static_data_db
taxonomy_db = taxonomy
challenges_db = challenges
permission_db = permissions
rewards_db = rewards
entity_list_db = entity_list
incident_db = incident
missions_db = missions
bounty_db = bounty
batch_db = batch
handshake_db = handshake
others_db = other
product_db = products
qrcode_db = qrcodes
csv_db = csv
report_db = report
material_db = material
device_db = devoce
algorithm_proposals_db = algorithm_proposals

[base_dao]
page_size = 100

[metadata]

min_image_width = 600
min_image_height = 400

thumbnail_directory = data/cache/thumbnails
thumbnail_width = 400
thumbnail_height = 400

verification_images_directory = data/cache/verification_images
verification_image_width = 1024

[qrcode]
logo_path = data/images/logo.png

[taxonomy]
image_folder = taxonomy_data/crops
labels_folder = taxonomy_data/labels

[rewards]
network = mumbai
token_contract_address = <token_contract_address>
ocean_token_address = <ocean_token_address>
public_address = <public_address>
account_private_key = <account_private_key>
network_url = <rpc_url>
rpc_timeout_seconds = 30
receipt_timeout_seconds = 90
peaq_address = <peaq_address>
peaq_mnemonic = <peaq_mnemonic>
peaq_rpc_url = <peaq_rpc_url>
chain_id = 1
filecoin_key = 
data_did = 

[celery]
broker_url = pyamqp://user:user@localhost//
result_backend = rpc://user:user@localhost//

[rabbitmq]
username = user
password = password
host = localhost
port = 5672
use_tls = no
certs_directory = <certs directory>

[MONGODB]
HOST = 127.0.0.1
PORT = 27017
DATABASE = crab
USERNAME = user
PASSWORD = password

[ALCHEMY_API_KEY]
eth_mainnet = api-key
polygon = api-key

[ipfs]
endpoint = <ipfs endpoint>
api_key = <ipfs api_key>
api_secret = <ipfs api_secret>

[training]
csv_directory = data/csv

[brainstem_c2d]
# Dedicated Node-to-Crab credentials. Use independent random values of at least
# 32 characters; never reuse the Flask/JWT/reward secrets.
export_bearer_token = <random_service_token_at_least_32_characters>
pseudonym_secret = <random_hmac_secret_at_least_32_characters>
# Non-secret rotation label. Change it whenever pseudonym_secret changes.
pseudonym_key_id = v1
# Separate operator credential for draft/activate/revoke release actions.
release_admin_bearer_token = <random_admin_token_at_least_32_characters>
# Read-only credential used only for the privacy-coarsened refresh verdict.
refresh_status_bearer_token = <random_status_token_at_least_32_characters>
# Private thresholds. Never return these or exact changed-participant counts.
refresh_min_contributors = 20
refresh_min_age_hours = 168
# Legal/privacy-approved version pinned into every cohort release.
consent_version = <approved_consent_version>

[brainstem_value]
# Fail closed until the exact algorithm, Node signer and separate attestation
# signer have been approved and provisioned.
enabled = false
amount = 1
approved_algorithm_digest = sha256:<approved_algorithm_image_digest>
node_signer_address = <approved_ocean_node_signer_address>
signing_private_key = <separate_attestation_private_key>

[participant_auth]
# Disabled until a reviewed DeSciLab deployment and Reown client are ready.
enabled = false
# Comma-separated exact scheme/host/port origins; no paths or wildcards.
allowed_origins = http://127.0.0.1:3000
# First physical canary runs on Optimism Sepolia.
chain_id = 11155420
challenge_ttl_seconds = 300
session_ttl_seconds = 900

[brainstem_personal_insight]
# Independent default-off participant-to-Node capability. Never reuse the
# participant cookie, cohort exporter token, JWT, or reward secrets.
enabled = false
algorithm_image_digest = sha256:<approved_personal_algorithm_image_digest>
# The paper-derived policy remains unavailable until all four immutable values
# are supplied from a separately approved release receipt.
resting_hrv_methods_algorithm_image_digest = sha256:<approved_resting_hrv_methods_image_digest>
resting_hrv_methods_approved_manifest_sha256 = <approved_resting_hrv_methods_manifest_sha256>
resting_hrv_methods_reference_sha256 = <approved_resting_hrv_methods_reference_sha256>
resting_sample_entropy_algorithm_image_digest = sha256:<approved_resting_sample_entropy_image_digest>
resting_sample_entropy_approved_manifest_sha256 = <approved_resting_sample_entropy_manifest_sha256>
resting_sample_entropy_reference_sha256 = <approved_resting_sample_entropy_reference_sha256>
sleep_baseline_algorithm_image_digest = sha256:<approved_sleep_baseline_image_digest>
sleep_baseline_approved_manifest_sha256 = <approved_sleep_baseline_manifest_sha256>
sleep_baseline_reference_sha256 = <approved_sleep_baseline_reference_sha256>
node_bearer_token = <random_personal_node_token_at_least_32_characters>
challenge_ttl_seconds = 300
grant_ttl_seconds = 300
capability_ttl_seconds = 60
result_ttl_seconds = 1209600

[brainstem_studies]
# Participant study routes stay closed until participant information, survey,
# science, privacy, and security reviews are explicitly approved. Researcher
# proposal preparation is controlled separately below.
enabled = false

[brainstem_generic_studies]
# Generic study/questionnaire inbox and researcher draft/review routes remain
# local-only and generated-only until all human gates are approved. Operator
# permit creation is a separate generated-only operation. Keeping any
# one of these three booleans false closes the path; no wallet is allowlisted in
# checked-in configuration.
enabled = false
generated_only = false
operator_operations_enabled = false
operator_wallets =
operator_allowed_origins = http://127.0.0.1:3000
operator_chain_id = 11155420
operator_challenge_ttl_seconds = 300
# Private 32+ character HMAC key for release-scoped participant bindings. Do
# not rotate it while any proposal using it is live. Remove it only after every
# such release is terminal and its retention period ends to crypto-shred linkage.
participant_binding_secret = <generated_64_lowercase_hex_characters>
# Public non-secret rotation label. A secret change requires a new label. The
# label is locked on first signed reservation and cannot drift for that proposal.
participant_binding_key_id = generated-study-binding-2026-01

[brainstem_recurring_insights]
# Study recurrence requires a separate participant signature. The generated
# worker also requires its own gate, while any external delivery setting must
# remain false. No recurring worker is scheduled by the checked-in runtime.
enabled = false
generated_worker_enabled = false
external_delivery_enabled = false
